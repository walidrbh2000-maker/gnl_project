# mosquitto.conf — Configuration Mosquitto SANS TLS (prototype localhost)
# Chemin dans Docker : /mosquitto/config/mosquitto.conf
#
# ⚠️  Ce fichier désactive TLS volontairement pour le développement local.
#     Pour la production (RPi déployé, réseau industriel), utiliser la version
#     TLS avec port 8883, cafile/certfile/keyfile et tls_version tlsv1.2.
#
# Standards visés en prod : IEC 62443-3-3 / NIST SP 800-183

# ── Général ────────────────────────────────────────────────────────────────────
pid_file /var/run/mosquitto/mosquitto.pid
persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S

# ── Listener plain MQTT 1883 (sans TLS) ───────────────────────────────────────
listener 1883
protocol mqtt

# Authentification obligatoire même sans TLS
# (évite l'accès anonyme sur le réseau local)
allow_anonymous false
password_file /mosquitto/config/passwd

# ── ACL (Access Control Lists) ─────────────────────────────────────────────────
acl_file /mosquitto/config/acl

# ── Limites de connexion ───────────────────────────────────────────────────────
max_connections 10
max_queued_messages 100
max_packet_size 65536

# Keepalive
keepalive_interval 60
