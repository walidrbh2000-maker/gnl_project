# ============================================================
# mosquitto.conf — Mosquitto 2.0 compatible
# Fixes:
#   • Suppression de `keepalive_interval` (directive retirée en 2.0)
#   • passwd_file pointe vers le chemin créé par l'entrypoint
# ============================================================

# --- Listener principal (MQTT) ---
listener 1883
protocol mqtt

# --- Listener WebSocket (optionnel, décommenter si besoin) ---
# listener 9001
# protocol websockets

# --- Authentification ---
# allow_anonymous interdit : toute connexion doit s'authentifier
allow_anonymous false
password_file /mosquitto/config/passwd

# --- Persistance ---
persistence true
persistence_location /mosquitto/data/

# --- Logs ---
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S

# --- Sécurité réseau ---
# Nombre max de connexions simultanées (-1 = illimité)
max_connections -1

# Taille max d'un paquet MQTT entrant (256 KB)
message_size_limit 262144

# --- Keep-alive : géré côté client en Mosquitto 2.0 ---
# `keepalive_interval` a été retiré depuis la v1.x ; ne pas inclure.
# Le serveur accepte la valeur négociée par chaque client (RFC 3.1.1 §3.1.2.10).
# Pour forcer un maximum : `max_keepalive <secondes>`  (0 = désactivé)
max_keepalive 120
