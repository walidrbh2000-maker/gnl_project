# mosquitto.conf — Configuration Mosquitto TLS pour le système GNL
# Chemin : /etc/mosquitto/mosquitto.conf
# Conforme : IEC 62443-3-3 / NIST SP 800-183

# ── Général ────────────────────────────────────────────────────────────────────
pid_file /var/run/mosquitto/mosquitto.pid
persistence true
persistence_location /var/lib/mosquitto/
log_dest file /var/log/mosquitto/mosquitto.log
log_type error
log_type warning
log_type notice
log_type information
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S

# ── Désactiver le port non-TLS (sécurité) ─────────────────────────────────────
# Pas de listener sur le port 1883 — uniquement TLS 8883
# listener 1883  ← DÉSACTIVÉ

# ── Listener TLS 8883 ─────────────────────────────────────────────────────────
listener 8883
protocol mqtt

# Certificats TLS 1.3
cafile   /etc/mosquitto/certs/ca.crt
certfile /etc/mosquitto/certs/server.crt
keyfile  /etc/mosquitto/certs/server.key

# Forcer TLS 1.2 minimum (TLS 1.3 préféré)
tls_version tlsv1.2

# Vérification certificat client (authentification mutuelle)
require_certificate false
# Mettre true en production avec PKI complète

# ── Authentification username/password ─────────────────────────────────────────
allow_anonymous false
password_file /etc/mosquitto/passwd

# ── ACL (Access Control Lists) ─────────────────────────────────────────────────
acl_file /etc/mosquitto/acl

# ── Limites de connexion ───────────────────────────────────────────────────────
max_connections 10
max_queued_messages 100
max_packet_size 65536

# Keepalive
keepalive_interval 60
