# docker-compose.yml — Environnement de développement GNL IoT (SANS TLS)
# Emplacement : docker/docker-compose.yml
# Usage : depuis la racine du projet → make start
#         ou manuellement → docker compose -f docker/docker-compose.yml up -d
#
# ⚠️  TLS désactivé — prototype localhost uniquement.
#     Port MQTT : 1883 (plain). Pour la production : 8883 + certificats X.509.
#
# IMPORTANT : tous les chemins relatifs (context, volumes) sont exprimés
# par rapport à ce fichier (docker/), donc "../" remonte à la racine projet.

services:

  # ── Mosquitto MQTT Broker ────────────────────────────────────────────────────
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: gnl_mosquitto
    ports:
      - "1883:1883"
    volumes:
      - ../raspberry_pi/mqtt/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ../raspberry_pi/mqtt/acl:/mosquitto/config/acl:ro
      # passwd est géré dans le conteneur via setup-mqtt (make setup-mqtt)
      # ou pré-généré et monté en lecture seule :
      # - ../raspberry_pi/mqtt/passwd:/mosquitto/config/passwd:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    networks:
      - gnl_net
    restart: unless-stopped
    healthcheck:
      # Healthcheck sur port 1883 (plain) — pas de flag TLS
      # mosquitto_sub -C 1 : reçoit 1 message puis quitte → confirme que le broker répond
      test:
        - "CMD-SHELL"
        - >
          mosquitto_sub
          -h localhost
          -p 1883
          -u gnl_dashboard
          -P "GNL_Dash_2025!"
          -t '$$SYS/broker/uptime'
          -C 1
          --quiet
          -W 5
          2>/dev/null || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ── InfluxDB 2.x ─────────────────────────────────────────────────────────────
  influxdb:
    image: influxdb:2.7
    container_name: gnl_influxdb
    ports:
      - "8086:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE:        setup
      DOCKER_INFLUXDB_INIT_USERNAME:    gnl_admin
      DOCKER_INFLUXDB_INIT_PASSWORD:    "GNL_Influx_2025!"
      DOCKER_INFLUXDB_INIT_ORG:         gnl_org
      DOCKER_INFLUXDB_INIT_BUCKET:      gnl_monitoring
      DOCKER_INFLUXDB_INIT_RETENTION:   30d
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: "gnl_influx_token_secret_2025"
    volumes:
      - influxdb_data:/var/lib/influxdb2
      - influxdb_config:/etc/influxdb2
    networks:
      - gnl_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ── Grafana ──────────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana-oss:10.4.0
    container_name: gnl_grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER:     gnl_admin
      GF_SECURITY_ADMIN_PASSWORD: "GNL_Grafana_2025!"
      GF_USERS_ALLOW_SIGN_UP:     "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/provisioning/dashboards/gnl_dashboard.json
    volumes:
      - grafana_data:/var/lib/grafana
      - ../raspberry_pi/dashboard/grafana_dashboard.json:/etc/grafana/provisioning/dashboards/gnl_dashboard.json:ro
    networks:
      - gnl_net
    depends_on:
      influxdb:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ── Simulateur Arduino ───────────────────────────────────────────────────────
  # Activer avec : docker compose --profile simulation up -d
  arduino_simulator:
    build:
      context: ..
      dockerfile: docker/Dockerfile.simulator
    image: gnl_arduino_sim
    container_name: gnl_arduino_sim
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: "1883"
      MQTT_USER: gnl_publisher
      MQTT_PASS: "GNL_Secure_2025!"
      SIM_SPEED: "2"
    networks:
      - gnl_net
    depends_on:
      mosquitto:
        condition: service_healthy
    restart: unless-stopped
    profiles:
      - simulation

  # ── API REST + Edge AI ────────────────────────────────────────────────────────
  gnl_edge:
    build:
      context: ..
      dockerfile: docker/Dockerfile.edge
    image: gnl_edge_node
    container_name: gnl_edge_node
    ports:
      - "5000:5000"
    environment:
      MQTT_HOST:       mosquitto
      MQTT_PORT:       "1883"
      MQTT_USER_PUBLISHER: gnl_publisher
      MQTT_PASS_PUBLISHER: "GNL_Secure_2025!"
      INFLUX_URL:      http://influxdb:8086
      INFLUX_TOKEN:    gnl_influx_token_secret_2025
      GNL_JWT_SECRET:  gnl_jwt_secret_change_in_prod
      SERIAL_PORT:     SIMULATED
    volumes:
      - ../raspberry_pi:/opt/gnl:ro
      - gnl_logs:/var/log/gnl
    networks:
      - gnl_net
    depends_on:
      mosquitto:
        condition: service_healthy
      influxdb:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:5000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  mosquitto_data:
  mosquitto_log:
  influxdb_data:
  influxdb_config:
  grafana_data:
  gnl_logs:

networks:
  gnl_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
